name: Discord Bot CI

on:
  push:
    branches: [main]
    paths:
      - 'discord-bot/**'
      - '!discord-bot/web/**'
      - '.github/workflows/bot-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'discord-bot/**'
      - '!discord-bot/web/**'
      - '.github/workflows/bot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: discord-bot/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: discord-bot

      - name: Type-check (tsc)
        run: npm run node:build
        working-directory: discord-bot
