name: Discord Bot CI

on:
  push:
    branches: [main]
    paths:
      - 'discord-bot/**'
      - '!discord-bot/web/**'
      - '.github/workflows/bot-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'discord-bot/**'
      - '!discord-bot/web/**'
      - '.github/workflows/bot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # @discordjs/voice needs >= 22.12; also matches the VPS runtime.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: discord-bot/package-lock.json

      # `npm install`, not `npm ci`: the VPS deploys with `npm install` and the
      # lockfile isn't strictly `npm ci`-clean across npm majors. tsc is what we
      # actually want to gate on here.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: discord-bot

      - name: Type-check (tsc)
        run: npm run node:build
        working-directory: discord-bot
