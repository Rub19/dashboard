name: Build Android

on:
  push:
    branches: [main, feat/full-native-android-compose]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci
        working-directory: ethone-next

      - name: Grant execute permission for gradlew
        run: chmod +x ethone-next/android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ethone-next/android/**/*.gradle*', 'ethone-next/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build Android
        run: |
          set -o pipefail
          cd ethone-next/android
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee gradle.log
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Surface Gradle errors
        if: failure()
        run: |
          cd ethone-next/android
          echo "--- Gradle error summary ---"
          grep -E "(ERROR|FAIL|> Task .* FAILED|Exception|error:)" gradle.log | tail -80
          echo "::error::$(grep -E 'FAIL|Exception' gradle.log | tail -1 | sed "s/'//g")"

      - name: List build outputs
        if: always()
        run: |
          echo "--- build/outputs tree ---" | tee -a ethone-next/android/gradle.log
          find ethone-next/android/app/build -type f 2>/dev/null | tee -a ethone-next/android/gradle.log
          echo "--- gradle what went wrong ---" | tee -a ethone-next/android/gradle.log
          sed -n '/What went wrong:/,/Try:/p' ethone-next/android/gradle.log | tail -40 | tee -a ethone-next/android/gradle.log | while IFS= read -r line; do echo "::error::$line"; done
          echo "--- Kotlin compiler errors ---" | tee -a ethone-next/android/gradle.log
          grep -E "^e:|^w:.*\.kt:" ethone-next/android/gradle.log | tail -30 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ETHONE-Android-APK
          path: ethone-next/android/app/build/outputs/apk/debug/*.apk

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-logs
          path: |
            ethone-next/android/gradle.log
            ethone-next/android/app/build/outputs/logs/
          if-no-files-found: ignore
