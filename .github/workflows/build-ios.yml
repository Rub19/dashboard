name: Build iOS IPA (Native SwiftUI)

on:
  push:
    branches: [main, feat/clean-monorepo-cross-platform-alignment, feat/ios-26-native-apis-and-frameworks, feat/global-liquid-glass-and-ios26-audit, feat/local-notifications-pomodoro-tasks, feat/hybrid-repo-nextjs-web-plus-native-swift-ios, feat/full-native-swift-liquid-glass-ios, feat/pure-apple-frameworks-and-core-haptics, qa/comprehensive-cross-platform-testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Supabase config into Info.plist
        run: |
          plutil -replace SUPABASE_URL -string "${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}" ios/App/App/Info.plist
          plutil -replace SUPABASE_ANON_KEY -string "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}" ios/App/App/Info.plist

      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App
          pod install

      - name: Verify Xcode Workspace
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -list

      - name: Archive iOS Project (No Signing)
        run: |
          cd ios/App
          mkdir -p build
          set -o pipefail
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee build/build.log

      - name: Package Payload to IPA
        run: |
          cd ios/App/build
          rm -rf Payload
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r ETHONE.ipa Payload/

      - name: Verify Widgets Extension in IPA
        run: |
          cd ios/App/build
          echo "--- PlugIns directory ---"
          ls -R Payload/App.app/PlugIns || true
          echo "--- EthoneWidgets.appex in IPA ---"
          unzip -l ETHONE.ipa | grep -i "EthoneWidgets.appex" || true

      - name: Write Build Summary on Failure
        if: failure()
        run: |
          {
            echo "### iOS build log"
            echo "```"
            if [ -f ios/App/build/build.log ]; then
              tail -n 120 ios/App/build/build.log
            else
              echo "No build.log captured"
            fi
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f ios/App/build/build.log ]; then
            ERRORS=$(grep -i "error:" ios/App/build/build.log | tail -n 30 | sed 's/%/%25/g; s/\r//g; :a; N; $!ba; s/\n/%0A/g')
            if [ -n "$ERRORS" ]; then
              echo "::error file=ios/App/App.xcodeproj/project.pbxproj,line=1::$ERRORS"
            else
              LAST_LINES=$(tail -n 80 ios/App/build/build.log | sed 's/%/%25/g; s/\r//g; :a; N; $!ba; s/\n/%0A/g')
              echo "::error file=.github/workflows/build-ios.yml,line=63::$LAST_LINES"
            fi
          fi

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-logs
          path: ios/App/build/build.log
          if-no-files-found: ignore

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETHONE-iOS-IPA
          path: ios/App/build/ETHONE.ipa
          retention-days: 7
          if-no-files-found: error
