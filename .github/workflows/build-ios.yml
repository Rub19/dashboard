name: Build iOS IPA (Native SwiftUI, iOS 26)

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Xcode 26 (stable) — IPA non signé
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode et SDK disponibles
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Archiver (sans signature)
        working-directory: ios
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project Ethone.xcodeproj \
            -scheme Ethone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Ethone.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee build/build.log

      - name: Empaqueter l'IPA
        working-directory: ios/build
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R Ethone.xcarchive/Products/Applications/*.app Payload/
          zip -qry ETHONE.ipa Payload
          ls -lh ETHONE.ipa
          echo "--- Extensions dans l'IPA ---"
          ls Payload/*.app/PlugIns 2>/dev/null || echo "(aucune extension)"

      - name: Résumé des erreurs de compilation
        if: failure()
        working-directory: ios/build
        run: |
          {
            echo "### Erreurs de compilation"
            echo '```'
            grep -E "error:" build.log | sort -u | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-log
          path: ios/build/build.log
          if-no-files-found: ignore

      - name: IPA
        uses: actions/upload-artifact@v4
        with:
          name: ETHONE-iOS-IPA
          path: ios/build/ETHONE.ipa
          retention-days: 14
          if-no-files-found: error
