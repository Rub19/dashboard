name: Build Web (Next.js)

on:
  push:
    branches: [main, feat/clean-monorepo-cross-platform-alignment]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build and Lint Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ethone-next/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ethone-next

      - name: Lint
        run: npm run lint
        working-directory: ethone-next

      - name: Build
        run: npm run build
        working-directory: ethone-next
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_WORKER_URL: ${{ secrets.NEXT_PUBLIC_WORKER_URL || 'https://ethone.dev' }}

      - name: Unit tests
        run: npm run test:unit
        working-directory: ethone-next

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ethone-web-build
          path: ethone-next/out/
          if-no-files-found: ignore
