name: Deploy ETHONE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install client dependencies
        run: cd ethone-next && npm ci
      - name: Build client
        run: cd ethone-next && npm run build
      - name: Install worker dependencies
        run: cd worker && npm ci
      - name: Run worker tests
        run: cd worker && npm test
      - name: Block private or local upload content
        run: node ./scripts/precommit-upload-check.mjs
      - name: Security audit
        run: node ./scripts/audit-security.mjs
      - name: Accessibility audit
        run: cd ethone-next && node scripts/a11y-audit.mjs

  deploy:
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install client dependencies
        run: cd ethone-next && npm ci
      - name: Build client
        run: cd ethone-next && npm run build
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ethone-next/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify deployed artifact
        run: node ./scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}" 12 5000
      - name: Verify canonical domain
        run: node ./scripts/verify-deployment.mjs "https://ethone.dev/" 12 5000
      - name: Verify canonical security headers
        run: node ./scripts/verify-security-headers.mjs "https://ethone.dev/"
