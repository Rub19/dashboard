name: Worker CI

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Syntax check
        run: npm run check
        working-directory: worker

      - name: Unit tests
        run: npm test
        working-directory: worker

      - name: Bundle dry-run
        run: npm run dry-run
        working-directory: worker
        continue-on-error: true
