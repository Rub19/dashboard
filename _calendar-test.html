<!doctype html>
<html lang="fr" data-v8-interactions data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Calendar time test harness</title>
<link rel="stylesheet" href="./v8/styles/tokens.css?bust=4">
<link rel="stylesheet" href="./v8/styles/base.css?bust=4">
<link rel="stylesheet" href="./v8/styles/components.css?bust=4">
<link rel="stylesheet" href="./v8/styles/shell.css?bust=4">
<link rel="stylesheet" href="./v8/styles/workspaces.css?bust=4">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>body{margin:0;height:100vh;background:var(--v8-canvas);}#log{position:fixed;bottom:0;left:0;right:0;max-height:100px;overflow:auto;background:#000;color:#0f0;font:11px monospace;padding:6px;z-index:9999;}</style>
</head>
<body>
<div id="stage" style="height:calc(100vh - 100px);"></div>
<div id="log"></div>
<script type="module">
localStorage.setItem("myspace_profiles_backup", JSON.stringify([{
  id: "test-profile",
  state: { events: [] }
}]));

const { mountCalendar } = await import(`./v8/pages/calendar.mjs?bust=${Date.now()}`);
const { createProfileRepository } = await import(`./v8/data/profile-repository.mjs?bust=${Date.now()}`);

const repository = createProfileRepository({ storage: localStorage });

const handlers = new Map();
const actions = {
  scope(id, handler) {
    handlers.set(id, handler);
    return () => handlers.delete(id);
  }
};

function log(message) {
  const line = document.createElement("div");
  line.textContent = message;
  document.getElementById("log").append(line);
}

document.addEventListener("click", (event) => {
  const el = event.target.closest("[data-action]");
  if (!el) return;
  const id = el.dataset.action;
  const handler = handlers.get(id);
  if (!handler) { log(`no handler: ${id}`); return; }
  const result = handler({ element: el });
  log(`${id} -> ${JSON.stringify(result)}`);
});

const stage = document.getElementById("stage");
mountCalendar(stage, {
  repository,
  actions,
  notify: (payload) => log(`notify: ${payload.title} - ${payload.message}`)
});
</script>
</body>
</html>
