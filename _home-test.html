<!doctype html>
<html lang="fr" data-v8-interactions data-density="comfortable" data-theme="night" data-accent="mint" data-space="personal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Home test harness</title>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>body{margin:0;background:var(--v8-canvas);}</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
if (navigator.serviceWorker) {
  const regs = await navigator.serviceWorker.getRegistrations();
  for (const r of regs) await r.unregister();
  const keys = await caches.keys();
  await Promise.all(keys.map((k) => caches.delete(k)));
}

const bust = Date.now();
const cssFiles = ["tokens.css", "base.css", "components.css", "shell.css", "workspaces.css"];
for (const name of cssFiles) {
  const text = await fetch(`/v8/styles/${name}?bust=${bust}`, { cache: "no-store" }).then((r) => r.text());
  const style = document.createElement("style");
  style.textContent = text;
  document.head.append(style);
}

const { mountHome } = await import(`./v8/pages/home.mjs?bust=${bust}`);
const { createHomeModel } = await import(`./v8/data/home-model.mjs?bust=${bust}`);

const now = new Date().toISOString();
function liveOf(state) {
  return { state: () => state, subscribe: () => () => {} };
}

const model = createHomeModel({
  snapshot: {
    profile: { name: "Rub19" },
    notes: [{ id: "n1", title: "Idee de projet", updatedAt: now }],
    tasks: [{ id: "t1", title: "Rendre le rapport", done: false, priority: "high" }],
    events: []
  }
});

mountHome(document.getElementById("stage"), model, {
  discordLive: liveOf({ available: true, displayName: "Rub19", status: "dnd", activityName: "", activityDetail: "", updatedAt: now }),
  weatherLive: liveOf({ available: true, city: "Brive-la-Gaillarde", country: "France", temperature: 28, description: "Partiellement nuageux", windSpeedKmh: 16, humidityPercent: 54, weatherCode: 2, isDay: true, forecast: [], updatedAt: now }),
  steamLive: liveOf({ available: true, displayName: "Rub19", status: "online", inGame: false, updatedAt: now }),
  githubLive: liveOf({ available: true, username: "Rub19", publicRepos: 12, followers: 8, avatarUrl: "", updatedAt: now }),
  minecraftLive: liveOf({ available: true, username: "Rub19", uuid: "abcdef1234567890", skinUrl: "", updatedAt: now }),
  sync: { status: () => ({ syncStatus: "saved" }), subscribe: () => () => {} }
});
</script>
</body>
</html>
