<!doctype html>
<html lang="fr" data-v8-interactions data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Notes rich text test harness</title>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>body{margin:0;height:100vh;background:var(--v8-canvas);}#log{position:fixed;bottom:0;left:0;right:0;max-height:120px;overflow:auto;background:#000;color:#0f0;font:11px monospace;padding:6px;z-index:9999;}</style>
</head>
<body>
<div id="stage" style="height:calc(100vh - 120px);"></div>
<div id="log"></div>
<script type="module">
const bust = Date.now();
const cssFiles = ["tokens.css", "base.css", "components.css", "shell.css", "workspaces.css"];
for (const name of cssFiles) {
  const text = await fetch(`/v8/styles/${name}?bust=${bust}`, { cache: "no-store" }).then((r) => r.text());
  const style = document.createElement("style");
  style.textContent = text;
  document.head.append(style);
}

globalThis.__xssFired = false;
globalThis.xssProbe = () => { globalThis.__xssFired = true; };

localStorage.setItem("myspace_profiles_backup", JSON.stringify([{
  id: "test-profile",
  state: {
    notes: [
      { id: "n1", title: "Note riche", content: "<p>Paragraphe <strong>gras</strong> et <em>italique</em>.</p><h2>Titre</h2><ul><li>Un</li><li>Deux</li></ul>", tags: [], pinned: false, created: "2026-07-30T10:00:00.000Z", updated: "2026-07-30T10:00:00.000Z" },
      { id: "n2", title: "Note historique", content: "Ancienne note en texte brut\nsur deux lignes.\n\nEt un second paragraphe.", tags: [], pinned: false, created: "2026-07-29T10:00:00.000Z", updated: "2026-07-29T10:00:00.000Z" }
    ]
  }
}]));

const { mountNotes } = await import(`./v8/pages/notes.mjs?bust=${bust}`);
const { createProfileRepository } = await import(`./v8/data/profile-repository.mjs?bust=${bust}`);

const repository = createProfileRepository({ storage: localStorage });

const handlers = new Map();
const actions = {
  scope(id, handler) {
    handlers.set(id, handler);
    return () => handlers.delete(id);
  }
};

function log(message) {
  const line = document.createElement("div");
  line.textContent = message;
  document.getElementById("log").append(line);
}

document.addEventListener("click", (event) => {
  const el = event.target.closest("[data-action]");
  if (!el) return;
  const id = el.dataset.action;
  const handler = handlers.get(id);
  if (!handler) { log(`no handler: ${id}`); return; }
  const result = handler({ element: el });
  log(`${id} -> ${JSON.stringify(result)}`);
});

const stage = document.getElementById("stage");
mountNotes(stage, {
  repository,
  actions,
  notify: (payload) => log(`notify: ${payload.title} - ${payload.message}`)
});
</script>
</body>
</html>
