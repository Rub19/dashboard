<!doctype html>
<html lang="fr" data-theme="night">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./v8/styles/tokens.css">
<link rel="stylesheet" href="./v8/styles/base.css">
<link rel="stylesheet" href="./v8/styles/shell.css">
<style>body{margin:0;background:#0b0e12;padding:20px;}#host{width:400px;}</style>
</head>
<body>
<div id="host"></div>
<script type="module">
import { spotifyLiveCard } from "./v8/ui/spotify-live.mjs";
import { refreshIcons } from "./v8/ui/icons.mjs";

const playback = {
  available: true,
  playing: true,
  controllable: true,
  title: "Last Resort",
  artist: "Papa Roach",
  album: "Infest",
  artwork: "",
  progressMs: 124000,
  durationMs: 199000
};

document.getElementById("host").append(spotifyLiveCard(playback, { variant: "home" }));
refreshIcons();
setTimeout(refreshIcons, 200);

window.__measure = () => {
  const body = document.querySelector(".v8-spotify-live__body");
  const controls = document.querySelector(".v8-spotify-controls");
  const strong = document.querySelector(".v8-spotify-live__body > strong");
  const p = document.querySelector(".v8-spotify-live__body > p");
  const progress = document.querySelector(".v8-spotify-progress");
  const bodyR = body.getBoundingClientRect();
  const controlsR = controls.getBoundingClientRect();
  const strongR = strong.getBoundingClientRect();
  const pR = p.getBoundingClientRect();
  const progressR = progress.getBoundingClientRect();
  function overlaps(a, b) {
    return !(a.right <= b.left || a.left >= b.right || a.bottom <= b.top || a.top >= b.bottom);
  }
  return {
    bodyR, controlsR, strongR, pR, progressR,
    bodyOverlapsControls: overlaps(bodyR, controlsR),
    strongOverlapsControls: overlaps(strongR, controlsR),
    pOverlapsControls: overlaps(pR, controlsR),
    progressOverlapsControls: overlaps(progressR, controlsR),
    hasProgressBar: Boolean(document.querySelector(".v8-spotify-progress__track"))
  };
};
</script>
</body>
</html>
