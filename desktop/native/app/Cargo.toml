[package]
name = "ethone-native"
version = "0.2.0"
edition = "2021"
authors = ["Rub19"]
description = "Ethone Desktop"

[features]
drive = []

[dependencies]
ethone-engine = { path = "../engine" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Networking_WinInet", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Controls_Dialogs", "Win32_System_ProcessStatus", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem"] }
tray-icon = { version = "0.21", default-features = false }
notify-rust = "4"
wry = { version = "0.53", default-features = false, features = ["os-webview"] }
rodio = { version = "0.20", default-features = false }
rusty-leveldb = "4"
keyring = { version = "3", features = ["windows-native"] }

[build-dependencies]
slint-build = "=1.18.1"
embed-resource = "3"
