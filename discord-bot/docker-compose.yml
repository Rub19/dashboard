services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ethone-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
