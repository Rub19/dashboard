# Lavalink 4 — configuration ETHONE
# Installé par scripts/lavalink-setup.sh dans ~/lavalink/application.yml.
# Doc : https://lavalink.dev/configuration/  ·  plugin YouTube :
# https://github.com/lavalink-devs/youtube-source

server:
  port: 2333
  address: 127.0.0.1   # jamais exposé sur Internet : le bot tourne sur la même machine

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: "CHANGE_ME"   # remplacé par le script avec LAVALINK_PASSWORD
    sources:
      youtube: false        # OBLIGATOIRE : la source YouTube intégrée est morte, le plugin la remplace
      bandcamp: false
      soundcloud: true
      twitch: false
      vimeo: false
      nico: true
      http: true            # flux directs (SomaFM, mp3…)
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 800
    frameBufferDurationMs: 5000   # buffer large : évite les saccades quand le CPU du VPS est chargé
    opusEncodingQuality: 5      # 10 = max CPU ; 5 est inaudible en vocal Discord
    resamplingQuality: LOW     # HIGH coûte cher en CPU pour rien sur Discord
    trackStuckThresholdMs: 30000   # 10 s sautait le morceau dès qu'un buffer tardait (VPS chargé)
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Clients essayés dans l'ordre. MUSIC = recherche ; TV = utilise le token OAuth ;
    # ANDROID_VR / TVHTML5_SIMPLY = secours sans token ; WEB / WEBEMBEDDED ne lisent
    # depuis une IP de datacenter qu'avec un PO token (sinon ils échouent vite, sans gravité).
    clients:
      - MUSIC
      - WEB
      - WEBEMBEDDED
      - ANDROID_VR
      - TV
      - TVHTML5_SIMPLY
    clientOptions:
      MUSIC:
        searching: true
        videoLoading: false
        playlistLoading: false
        playback: false
      WEB:
        searching: true
        videoLoading: true
        playlistLoading: true
        playback: true
      WEBEMBEDDED:
        searching: false
        videoLoading: true
        playlistLoading: false
        playback: true
      ANDROID_VR:
        searching: true
        videoLoading: true
        playlistLoading: true
        playback: true
      TV:
        searching: false
        videoLoading: false
        playlistLoading: false
        playback: true
      TVHTML5_SIMPLY:
        searching: true
        videoLoading: true
        playlistLoading: false
        playback: true
    oauth:
      # Au premier démarrage, Lavalink affiche dans ses logs un lien
      # https://www.google.com/device + un code : ouvre-le avec un COMPTE
      # GOOGLE JETABLE. Le refresh token apparaît ensuite dans les logs —
      # colle-le ci-dessous (ou dans LAVALINK_YT_REFRESH_TOKEN pour le script)
      # pour ne plus jamais refaire la manip.
      enabled: true
      # refreshToken: "1//0..."
      # skipInitialization: true

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO   # nécessaire pour voir le code OAuth et le refresh token
  request:
    enabled: false
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 7
