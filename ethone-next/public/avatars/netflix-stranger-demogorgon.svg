<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <rect width="500" height="500" rx="40" fill="#0B090A"/>
  <!-- Red Creepy Background Glow -->
  <circle cx="250" cy="250" r="160" fill="#BA181B" opacity="0.3"/>
  <!-- Open Flower Petal Face -->
  <polygon points="250,80 290,200 250,250 210,200" fill="#A4161A" stroke="#E5383B" stroke-width="4"/>
  <polygon points="380,180 300,240 250,250 280,190" fill="#A4161A" stroke="#E5383B" stroke-width="4"/>
  <polygon points="340,360 280,280 250,250 300,250" fill="#A4161A" stroke="#E5383B" stroke-width="4"/>
  <polygon points="160,360 220,280 250,250 200,250" fill="#A4161A" stroke="#E5383B" stroke-width="4"/>
  <polygon points="120,180 200,240 250,250 170,190" fill="#A4161A" stroke="#E5383B" stroke-width="4"/>
  <!-- Teeth Rows Center Void -->
  <circle cx="250" cy="250" r="45" fill="#0B090A" stroke="#F5F3F4" stroke-width="6" stroke-dasharray="8 6"/>
  <circle cx="250" cy="250" r="25" fill="#660708"/>
</svg>