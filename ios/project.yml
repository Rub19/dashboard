name: Ethone

options:
  bundleIdPrefix: dev.ethone
  minimumXcodeGenVersion: 2.38.0
  developmentLanguage: fr
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Ethone:
    type: application
    platform: iOS
    sources:
      - path: Ethone
        excludes:
          - Info.plist
          - Ethone.entitlements
      - path: Shared
    dependencies:
      - target: EthoneWidgets
      - target: EthoneNotificationService
      - target: EthoneNotificationContent
    info:
      path: Ethone/Info.plist
      properties:
        CFBundleDisplayName: ETHONE
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: dev.ethone.app
            CFBundleURLSchemes:
              - ethone
        NSFaceIDUsageDescription: ETHONE utilise Face ID pour déverrouiller les zones sensibles de l'application.
        NSCalendarsFullAccessUsageDescription: ETHONE affiche vos événements iPhone à côté de ceux d'ETHONE (lecture seule).
        NSLocationWhenInUseUsageDescription: ETHONE utilise votre position pour afficher la météo locale.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Ethone/Ethone.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.ethone.app
        com.apple.developer.associated-domains:
          - applinks:ethone.dev
          - webcredentials:ethone.dev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ethone.app
        PRODUCT_NAME: ETHONE
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  EthoneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: EthoneWidgets
        excludes:
          - Info.plist
          - EthoneWidgets.entitlements
      - path: Shared
    info:
      path: EthoneWidgets/Info.plist
      properties:
        CFBundleDisplayName: ETHONE Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: EthoneWidgets/EthoneWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.ethone.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ethone.app.widgets
        SKIP_INSTALL: YES

  EthoneNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: EthoneNotificationService
        excludes:
          - Info.plist
    info:
      path: EthoneNotificationService/Info.plist
      properties:
        CFBundleDisplayName: ETHONE Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ethone.app.notification-service
        SKIP_INSTALL: YES

  EthoneNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: EthoneNotificationContent
        excludes:
          - Info.plist
    info:
      path: EthoneNotificationContent/Info.plist
      properties:
        CFBundleDisplayName: ETHONE Notification UI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory:
              - ETHONE_TASK
              - ETHONE_HABIT
              - ETHONE_FOCUS
              - ETHONE_BILL
            UNNotificationExtensionInitialContentSizeRatio: 0.3
            UNNotificationExtensionDefaultContentHidden: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ethone.app.notification-content
        SKIP_INSTALL: YES

schemes:
  Ethone:
    build:
      targets:
        Ethone: all
    run:
      config: Debug
    archive:
      config: Release
