<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>ETHONE Accessibility Harness</title>
  <link rel="stylesheet" href="../ui/keyboard-first.css?v=9">
  <style>
    body{font-family:system-ui;background:#09090b;color:#f5f5f2;padding:32px}
    button,input,[role="button"]{margin:6px;padding:10px}
    .modal-overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.7)}
    .modal-overlay.open{display:grid}
    .modal{width:320px;padding:20px;background:#15151a;border:1px solid #444;border-radius:12px}
  </style>
</head>
<body>
  <nav id="main-sidebar" aria-label="Navigation principale">
    <button class="nav-item active" data-page="dashboard">Dashboard</button>
    <button class="nav-item" data-page="settings">Settings</button>
  </nav>
  <main id="main-content">
    <section class="tab-content active" id="page-dashboard">
      <h1>Dashboard</h1>
      <button id="open-test" type="button" onclick="openModal('test')">Open dialog</button>
      <div id="space-control" onclick="window.harnessSpace=(window.harnessSpace||0)+1;this.setAttribute('data-activated',String(window.harnessSpace))">Keyboard action</div>
      <div class="todo-item" id="nested-control" onclick="this.setAttribute('data-activated','true')"><span>Open item</span><button type="button" onclick="event.stopPropagation()">Nested action</button></div>
      <output id="save-count" aria-live="polite">0</output>
    </section>
    <section class="tab-content" id="page-settings"><h1>Settings</h1><button>Hidden action</button></section>
  </main>
  <div class="modal-overlay" id="modal-test" aria-hidden="true" inert onclick="closeModalIfOverlay(event,'test')">
    <div class="modal">
      <h2>Test dialog</h2>
      <label for="test-name">Name</label>
      <input id="test-name" autocomplete="off">
      <button type="button" data-default-action onclick="window.harnessSaves=(window.harnessSaves||0)+1;document.getElementById('save-count').textContent=String(window.harnessSaves);closeModal('test')">Save</button>
      <button type="button" class="modal-close" onclick="closeModal('test')">Close</button>
    </div>
  </div>
  <script>window.harnessSaves=0;window.harnessSpace=0;</script>
  <script src="../components/modals.js?v=3"></script>
  <script src="../ui/accessibility.js?v=9"></script>
  <script src="../ui/keyboard-first.js?v=14"></script>
</body>
</html>
