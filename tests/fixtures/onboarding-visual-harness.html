<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETHONE Onboarding Visual Harness</title>
  <style>
    html,
    body,
    iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      overflow: hidden;
      background: #09090b;
    }

    iframe {
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="ethone-app" title="ETHONE onboarding QA" src="../../index.html?onboardingVisualQa=9&amp;build=283"></iframe>
  <script>
    (function () {
      "use strict";

      var PROFILE_ID = "ethone-onboarding-polish-qa";
      var frame = document.getElementById("ethone-app");
      var started = false;

      function waitFor(check, timeout, label) {
        var started = Date.now();
        return new Promise(function (resolve, reject) {
          (function poll() {
            try {
              if (check()) {
                resolve();
                return;
              }
            } catch (error) {}
            if (Date.now() - started > timeout) {
              reject(new Error("Onboarding harness timed out while waiting for " + (label || "the application") + "."));
              return;
            }
            setTimeout(poll, 80);
          })();
        });
      }

      function runInApp(source) {
        return frame.contentWindow.eval(source);
      }

      async function openOnboarding() {
        await waitFor(function () {
          return runInApp("document.readyState === 'complete' && typeof window.showDashboardOrProfiles === 'function' && typeof window.defState === 'function'");
        }, 30000, "the profile runtime");

        runInApp("(function(){" +
          "window.__ethoneSkipExternalWidgets=true;" +
          "window.__ethoneDisableExperimentalBoot=true;" +
          "window.saveCloudState=function(){return Promise.resolve(true)};" +
          "var qa={id:'" + PROFILE_ID + "',name:'Rub QA',avatar:'',createdAt:Date.now(),settings:{},state:window.defState('Rub QA')};" +
          "profiles=[qa];currentId=qa.id;" +
          "_sbUser={id:qa.id,email:'qa@local.test',user_metadata:{full_name:qa.name}};" +
          "window.__qaOriginalShowAuth=window.showAuth;" +
          "window.showDashboardOrProfiles();" +
          "window.showAuth=function(){return false};" +
          "document.body.classList.add('ethone-dashboard-mounted');" +
          "return true;" +
        "})()");

        await waitFor(function () {
          return runInApp("Boolean(window.ETHONELazyModules && typeof window.ETHONELazyModules.load === 'function')");
        }, 10000, "the lazy module loader");
        await Promise.resolve(runInApp("window.ETHONELazyModules.load('dashboard')"));

        await waitFor(function () {
          return runInApp("Boolean(window.ETHONEFirstRun && window.ETHONEFirstRun.replay)");
        }, 30000, "the onboarding runtime");

        runInApp("(function(){" +
          "var link=document.querySelector('link[href*=\\\"onboarding-premium-final.css\\\"]');" +
          "if(link)link.href='./ui/onboarding-premium-final.css?qa='+Date.now();" +
          "return true;" +
        "})()");
        runInApp("window.ethoneDevLaunchOnboarding()");
        await waitFor(function () {
          return runInApp("Boolean(document.getElementById('ethone-first-run-root') && document.querySelector('#ethone-first-run-root .fron-overlay'))");
        }, 10000, "the onboarding surface");
        document.title = "ETHONE Onboarding QA - ready";
      }

      window.cleanupOnboardingHarness = function () {
        runInApp("(function(){" +
          "Object.keys(localStorage).filter(function(key){return key.indexOf('" + PROFILE_ID + "')!==-1}).forEach(function(key){localStorage.removeItem(key)});" +
          "if(localStorage.getItem('myspace_profiles_backup_owner')==='" + PROFILE_ID + "'){localStorage.removeItem('myspace_profiles_backup');localStorage.removeItem('myspace_profiles_backup_owner');}" +
          "try{profiles=[];currentId=null;_sbUser=null;(window.__qaOriginalShowAuth||window.showAuth)()}catch(error){}" +
          "return true;" +
        "})()");
      };

      window.addEventListener("pagehide", function () {
        try {
          runInApp("Object.keys(localStorage).filter(function(key){return key.indexOf('" + PROFILE_ID + "')!==-1}).forEach(function(key){localStorage.removeItem(key)});if(localStorage.getItem('myspace_profiles_backup_owner')==='" + PROFILE_ID + "'){localStorage.removeItem('myspace_profiles_backup');localStorage.removeItem('myspace_profiles_backup_owner');}true");
        } catch (error) {}
      }, { once: true });

      function start() {
        if (started) return;
        started = true;
        openOnboarding().catch(function (error) {
          document.title = "Onboarding harness error: " + error.message;
        });
      }

      setTimeout(start, 0);
    })();
  </script>
</body>
</html>
