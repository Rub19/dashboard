<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ETHONE Mission Control QA</title>
  <link rel="stylesheet" href="../ui/tokens.css">
  <link rel="stylesheet" href="../ui/mission-control.css?v=94">
  <style>
    html,body{width:100%;height:100%;margin:0;background:#09090b;color:#f4f4f5;font-family:Inter,system-ui,sans-serif}
    #main-content{display:block;width:100%;height:100%}.tab-content{display:none}.tab-content.active{display:block}
    #auth-screen,#profile-screen,#password-screen{display:none}
  </style>
</head>
<body>
  <main id="main-content"><section class="tab-content active" id="page-dashboard"></section></main>
  <div id="auth-screen"></div><div id="profile-screen"></div><div id="password-screen"></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    window._lang="fr";
    const sampleSpaces=[
      {id:"personal",name:"Personnel",description:"Vie, journal et habitudes",template:"personal",icon:"home",accent:"#8b5cf6"},
      {id:"development",name:"Development",description:"Code, GitHub et deep work",template:"development",icon:"code-2",accent:"#7c3aed"},
      {id:"gaming",name:"Gaming",description:"Sessions, amis et performances",template:"gaming",icon:"gamepad-2",accent:"#a855f7"}
    ];
    let activeSpace="development";
    const profile={name:"Alex",state:{
      aiSessions:[
        {id:"ai-1",title:"Architecture ETHONE",provider:"Groq",updatedAt:Date.now()},
        {id:"ai-2",title:"Release checklist",provider:"OpenAI",updatedAt:Date.now()-3600000}
      ],
      notes:[{id:"note-project",title:"Mission Control",tag:"project",updatedAt:Date.now()}],
      items:[{id:"file-project",name:"ETHONE v6",type:"project",updatedAt:Date.now()-7200000}]
    }};
    window.curP=()=>profile;
    window.ETHONEWorkspaces={
      all:()=>sampleSpaces,
      active:()=>sampleSpaces.find(item=>item.id===activeSpace),
      setActive(id){activeSpace=id;return this.active()},
      create(input){const item=Object.assign({id:"space-"+Date.now()},input);sampleSpaces.push(item);activeSpace=item.id;return item}
    };
    window.ETHONEFlow={
      flows:()=>[
        {id:"personal",name:"Personal Flow",description:"Daily planning and habits",icon:"home",color:"#8b5cf6"},
        {id:"development",name:"Development Flow",description:"GitHub, Brain, notes and terminal",icon:"square-terminal",color:"#7c3aed",widgets:["github"]},
        {id:"gaming",name:"Gaming Flow",description:"Discord, Spotify and performance",icon:"gamepad-2",color:"#a855f7"}
      ],
      state:()=>({activeId:"development",favorites:["development"]}),
      apply:()=>true,
      openBuilder:()=>window.toast("Flow Builder opened","success")
    };
    window.ETHONEDesktop={
      state:()=>({activeWindow:"window-ai",windows:[
        {id:"window-dashboard",page:"dashboard",screen:"main",workspace:0},
        {id:"window-ai",page:"ai",screen:"main",workspace:0,pinned:true},
        {id:"window-notes",page:"notes",screen:"studio",workspace:1,minimized:true}
      ]}),
      minimizeActive(){},maximizeActive(){},pinActive(){},closeActive(){}
    };
    window.ETHONEWindowManager={openCurrent:()=>true,state:()=>window.ETHONEDesktop.state()};
    const definitions={github:{label:"GitHub",category:"Developer",icon:"git-branch"},brain:{label:"Brain",category:"AI",icon:"brain-circuit"},calendar:{label:"Calendar",category:"Planning",icon:"calendar-days"},spotify:{label:"Spotify",category:"Media",icon:"music-2"}};
    const actions={register(){},dispatch(){return true},has(){return false}};
    window.Ethone={get(name){if(name==="widgets")return{list:()=>Object.keys(definitions).map(id=>({id,definition:definitions[id]}))};if(name==="actions")return actions;return null},define(){}};
    window.ETHONEActions=actions;
    window.toast=(message)=>{document.body.dataset.lastToast=message};
    localStorage.setItem("ethone:dashboard-v4-layout",JSON.stringify({version:2,instances:Object.keys(definitions).map(id=>({instanceId:id,type:id})),hidden:[]}));
    localStorage.setItem("ethone:dashboard-v4-layouts",JSON.stringify({version:1,activeId:"control",layouts:[{id:"control",name:"Control Center",prefs:{instances:[{instanceId:"hero"},{instanceId:"brain"}]}},{id:"dev",name:"Developer OS",prefs:{instances:[{instanceId:"github"},{instanceId:"terminal"},{instanceId:"brain"}]}}]}));
    localStorage.setItem("ethone:studio:v1",JSON.stringify({projects:[{id:"studio-project",name:"Personal OS Builder",description:"Dashboard Studio",updated:Date.now()}]}));
  </script>
  <script src="../services/os/mission-control-model.js?v=4"></script>
  <script src="../ui/mission-control.js?v=100"></script>
  <script>window.addEventListener("load",()=>window.ETHONEMissionControl.open())</script>
</body>
</html>
